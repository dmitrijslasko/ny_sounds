<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound Button</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --bg2: #111827;
        --card: rgba(15, 23, 42, 0.78);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-strong: #16a34a;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(34, 197, 94, 0.2), transparent 30%),
          linear-gradient(160deg, var(--bg), var(--bg2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        padding: 40px 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 24px 80px var(--shadow);
        backdrop-filter: blur(16px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1rem;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 16px 26px;
        font-size: 1rem;
        font-weight: 700;
        color: #052e16;
        background: linear-gradient(180deg, #86efac, var(--accent));
        cursor: pointer;
        box-shadow: 0 14px 32px rgba(34, 197, 94, 0.28);
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 36px rgba(34, 197, 94, 0.34);
        filter: brightness(1.04);
      }

      button:active {
        transform: translateY(1px) scale(0.99);
        background: linear-gradient(180deg, #4ade80, var(--accent-strong));
      }

      #status {
        margin-top: 18px;
        min-height: 1.25em;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .hint {
        margin-top: 10px;
        font-size: 0.85rem;
        color: rgba(148, 163, 184, 0.8);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Press to play</h1>
      <p>Click the button to play the sound from sounds</p>
      <button id="playButton" type="button">reject</button>
      <button id="playButton2" type="button" style="margin-left: 10px;">accept</button>
      <div id="status" aria-live="polite"></div>
    </main>

    <script>
      const button = document.getElementById('playButton');
      const button2 = document.getElementById('playButton2');
      const status = document.getElementById('status');

      async function playSound(source, label) {
        try {
          status.textContent = `Playing ${label}...`;
          const audio = new Audio(source);
          audio.preload = 'auto';
          await audio.play();

          audio.addEventListener('ended', () => {
            status.textContent = `${label} finished.`;
          });
        } catch (error) {
          status.textContent = `Could not play ${label}.`;
          console.error(error);
        }
      }

      button.addEventListener('click', async () => {
        playSound('sounds/fahhh_KcgAXfs.mp3', 'sound');
      });

      button2.addEventListener('click', () => {
        playSound('sounds/file2.mp3', 'file 2');
      });
    </script>
  </body>
</html>
